# Dedicated KubeVirt migration network stretched between the clusters: a
# disconnected L2VNI, east-west only, with no routing domain nor gateway.
apiVersion: network.openperouter.io/v1alpha1
kind: L2VNI
metadata:
  name: migration-net
  namespace: openperouter-system
spec:
  vni: 666
  hostMaster:
    type: LinuxBridge
    linuxBridge:
      lifecycle: Managed
