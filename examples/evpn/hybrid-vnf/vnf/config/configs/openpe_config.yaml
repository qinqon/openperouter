# Static configuration for the on-prem OpenPERouter VNF (systemd/host mode).
#
# Topology:
#   this VNF (ASN 64514, VTEP 100.65.0.0/24 on the underlay NIC)
#     --- IPsec/Cloud VPN --->  3 GCP control-plane route reflectors (ASN 65001)
#   A single L2VNI (vni 110) is stretched to the GCP L2VNI of the same vni.
#   Its host side is an EXTERNAL Linux bridge (br-vlan) into which the operator
#   plugs the workload VLAN (see vlan-setup.sh). Pure east-west L2, no gateway.
#
# The underlay interface is a NetworkDevice: the named host NIC is moved into
# the "perouter" netns and used as the VTEP source / VPN egress. Replace
# "eth1" below with the laptop uplink reserved for the VNF (max 15 chars); it
# is consumed by the host and cannot be used by the host OS afterwards, so use
# a spare NIC / USB-eth / dedicated VLAN subinterface.
#
# The 3 neighbor addresses below are examples from GCP_RR_CIDR (10.0.1.0/24).
# They are derived per-node from the real openpe.io/nodeindex annotation of
# each GCP control-plane node, not from a fixed formula (see gcp/vtep.sh) --
# replace them with the actual addresses printed by:
#   cd ../../gcp && source env.sh && for n in "${MASTER_NODES[@]}"; do
#     source vtep.sh; vtep_ip_for_node "$n" "$GCP_RR_CIDR"; done
underlays:
  - name: onprem
    asn: 64514
    tunnelEndpoint:
      cidrs:
        - 100.65.0.0/24
    interfaces:
      - type: NetworkDevice
        networkDevice:
          interfaceName: eth1
    neighbors:
      # eBGP multihop to every GCP route reflector, reached over the VPN.
      # Each RR reflects the workers' ipv4-unicast (VTEP reachability) and
      # EVPN routes, so peering all 3 gives redundancy: any one RR being
      # unreachable still leaves 2 sessions learning every GCP VTEP.
      - asn: 65001
        address: 10.0.1.0 # REPLACE: route reflector 1 (see comment above)
        properties:
          - type: ebgpMultiHop
            ebgpMultiHop:
              ttl: 10
      - asn: 65001
        address: 10.0.1.4 # REPLACE: route reflector 2
        properties:
          - type: ebgpMultiHop
            ebgpMultiHop:
              ttl: 10
      - asn: 65001
        address: 10.0.1.5 # REPLACE: route reflector 3
        properties:
          - type: ebgpMultiHop
            ebgpMultiHop:
              ttl: 10
l2vnis:
  - name: vlan-stretch
    vni: 110
    vxlanPort: 4789
    hostMaster:
      type: LinuxBridge
      linuxBridge:
        # External: the bridge is created by vlan-setup.sh and carries the
        # workload VLAN subinterface. OpenPERouter only attaches the EVPN veth.
        name: br-vlan
        lifecycle: External
