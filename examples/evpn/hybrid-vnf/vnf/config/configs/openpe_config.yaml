# Static configuration for the on-prem OpenPERouter VNF (systemd/host mode).
#
# Topology:
#   this VNF (ASN 64514, VTEP 100.65.0.0/24 on the underlay NIC)
#     --- IPsec/Cloud VPN --->  3 GCP control-plane route reflectors (ASN 65001)
#   A single L2VNI (vni 110) is stretched to the GCP L2VNI of the same vni.
#   Its host side is an EXTERNAL Linux bridge (br-vlan) into which the operator
#   plugs the workload VLAN (see vlan-setup.sh). Pure east-west L2, no gateway.
#
# The underlay interface is a NetworkDevice: the named interface is moved
# into the "perouter" netns and used as the VTEP source / VPN egress. It is
# consumed and cannot be used outside perouter afterwards, so use either:
#   - a spare/dedicated NIC (USB-eth, VLAN subinterface), or
#   - (recommended for a laptop with a single uplink) a macvlan sub-interface
#     in bridge mode on the real uplink, so the physical NIC/its own address
#     are never touched: e.g.
#       ip link add macvlan0 link <real-uplink> type macvlan mode bridge
#       ip addr add <free-LAN-ip>/<prefix> dev macvlan0
#       ip link set macvlan0 up
#     Give it a real routable LAN address (static, or DHCP) BEFORE the
#     controller runs -- NetworkDevice never assigns an address itself, it
#     only moves the interface and restores whatever address(es) it already
#     had. Note this address is on the *same* NAT hop as the host's own
#     uplink; going through a second, container-engine-managed NAT on top
#     (podman/Docker default bridge networking for this same interface) has
#     been observed to silently break IKE on some home routers -- see
#     ../../README.md's "GCP firewall" gotcha for the analogous GCP-side
#     issue and the README section on this laptop-side NAT constraint.
#
# Replace "macvlan0" below with your own interface name (max 15 chars) if
# different, and add a default route inside perouter once it's moved (the
# move restores addresses, not routes):
#   ip netns exec perouter ip route add default via <LAN-gateway> dev macvlan0
#
# The 3 neighbor addresses below are derived per-node from the real
# openpe.io/nodeindex annotation of each GCP control-plane node, not from a
# fixed formula (see gcp/vtep.sh) -- they are NOT guessable ahead of time and
# will differ on every cluster/rebuild. Get the real ones with:
#   cd ../../gcp && source env.sh && source network.env && source vtep.sh
#   for n in "${MASTER_NODES[@]}"; do vtep_ip_for_node "$n" "$GCP_RR_CIDR"; done
underlays:
  - name: onprem
    asn: 64514
    tunnelEndpoint:
      cidrs:
        - 100.65.0.0/24
    interfaces:
      - type: NetworkDevice
        networkDevice:
          interfaceName: macvlan0
    neighbors:
      # eBGP multihop to every GCP route reflector, reached over the VPN.
      # Each RR reflects the workers' ipv4-unicast (VTEP reachability) and
      # EVPN routes, so peering all 3 gives redundancy: any one RR being
      # unreachable still leaves 2 sessions learning every GCP VTEP.
      - asn: 65001
        address: 10.0.1.4 # ellorent-vlan-evpn-k25qm-master-0
        properties:
          - type: ebgpMultiHop
            ebgpMultiHop:
              ttl: 10
      - asn: 65001
        address: 10.0.1.5 # ellorent-vlan-evpn-k25qm-master-1
        properties:
          - type: ebgpMultiHop
            ebgpMultiHop:
              ttl: 10
      - asn: 65001
        address: 10.0.1.0 # ellorent-vlan-evpn-k25qm-master-2
        properties:
          - type: ebgpMultiHop
            ebgpMultiHop:
              ttl: 10
l2vnis:
  - name: vlan-stretch
    vni: 110
    vxlanPort: 4789
    hostMaster:
      type: LinuxBridge
      linuxBridge:
        # External: the bridge is created by vlan-setup.sh and carries the
        # workload VLAN subinterface. OpenPERouter only attaches the EVPN veth.
        name: br-vlan
        lifecycle: External
