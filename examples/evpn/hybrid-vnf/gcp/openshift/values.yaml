openperouter:
  logLevel: debug
  cri: crio
  # Router/controller/reloader/nodemarker all use this single image (the chart
  # has no separate image for the FRR container). Built from this branch,
  # which carries the tunnelEndpoint.interfaceName (ipvlan-L3 CNIDevice VTEP)
  # support the GCP underlay in this example depends on.
  image:
    repository: quay.io/ellorent/router
    tag: vlan-evpn-gcp
    pullPolicy: Always
  # OpenPERouter runs on every node: the control-plane nodes act as pure BGP
  # route reflectors (see gcp/underlay.sh) and need the router/controller pods
  # too. No nodeSelector override needed -- the chart's default tolerations
  # already cover the control-plane/master NoSchedule taints.
