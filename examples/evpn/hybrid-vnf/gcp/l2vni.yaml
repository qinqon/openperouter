---
# Stretched L2VNI (vni 110), matching the on-prem VNF's L2VNI. Disconnected
# (no routingDomain, no gateway): pure east-west L2 between the GCP pods and the
# on-prem VLAN. The controller creates the host bridge br-hs-110 and a NAD can
# bridge pods onto it.
#
# Scoped to workers: the control-plane nodes are pure BGP route reflectors
# with no tunnelEndpoint, so they cannot host a VNI (a VNI's VTEP is derived
# from the underlay's tunnelEndpoint, which the reflectors do not have).
apiVersion: network.openperouter.io/v1alpha1
kind: L2VNI
metadata:
  name: vlan-stretch
  namespace: openperouter-system
spec:
  nodeSelector:
    matchLabels:
      node-role.kubernetes.io/worker: ""
  vni: 110
  vxlanPort: 4789
  hostMaster:
    type: LinuxBridge
    linuxBridge:
      lifecycle: Managed
---
# Bridge NAD placing pods on the L2VNI host bridge (br-hs-110). Whereabouts
# assigns addresses from the stretched L2 subnet; keep them out of the range
# used by the on-prem VLAN host to avoid collisions.
#
# mtu: the bridge CNI plugin applies this to the pod-facing veth it creates.
# This interface is entirely outside OpenPERouter's reconcile loop (only the
# controller's OWN host-side veth into br-hs-110 gets the automatic
# underlayMTU-50 treatment), so it needs its own explicit value, or a pod
# would advertise MTU 1500 while every other interface on this L2 segment
# is 1380 -- a classic silent MTU black hole (small packets, e.g. SSH,
# work; anything larger, e.g. an HTTP response, hangs). 1380 matches the
# on-prem side's *effective* MTU (see gcp/underlay.sh's ipvlan mtu: 1430,
# and ../README.md's MTU gotcha for why the on-prem side reaches the same
# 1380 dynamically instead of via a static interface MTU): one L2
# broadcast domain needs one uniform MTU, even though pure worker-to-worker
# VXLAN traffic on this cluster could otherwise tolerate more.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: vlan-stretch
  namespace: default
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "vlan-stretch",
      "type": "bridge",
      "bridge": "br-hs-110",
      "mtu": 1380,
      "ipam": {
        "type": "whereabouts",
        "range": "192.168.100.0/24",
        "range_start": "192.168.100.10",
        "range_end": "192.168.100.100"
      }
    }
# The workload on this NAD is a KubeVirt VirtualMachine (vm-workload.yaml),
# not a plain pod: its guest OS sets its own static IP via cloud-init,
# independent of whatever this NAD's whereabouts IPAM assigns the host-side
# veth. See vm-workload.yaml.
