---
# Stretched L2VNI (vni 110), matching the on-prem VNF's L2VNI. Disconnected
# (no routingDomain, no gateway): pure east-west L2 between the GCP pods and the
# on-prem VLAN. The controller creates the host bridge br-hs-110 and a NAD can
# bridge pods onto it.
#
# Scoped to workers: the control-plane nodes are pure BGP route reflectors
# with no tunnelEndpoint, so they cannot host a VNI (a VNI's VTEP is derived
# from the underlay's tunnelEndpoint, which the reflectors do not have).
apiVersion: network.openperouter.io/v1alpha1
kind: L2VNI
metadata:
  name: vlan-stretch
  namespace: openperouter-system
spec:
  nodeSelector:
    matchLabels:
      node-role.kubernetes.io/worker: ""
  vni: 110
  vxlanPort: 4789
  hostMaster:
    type: LinuxBridge
    linuxBridge:
      lifecycle: Managed
---
# Bridge NAD placing pods on the L2VNI host bridge (br-hs-110). Whereabouts
# assigns addresses from the stretched L2 subnet; keep them out of the range
# used by the on-prem VLAN host to avoid collisions.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: vlan-stretch
  namespace: default
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "vlan-stretch",
      "type": "bridge",
      "bridge": "br-hs-110",
      "ipam": {
        "type": "whereabouts",
        "range": "192.168.100.0/24",
        "range_start": "192.168.100.10",
        "range_end": "192.168.100.100"
      }
    }
---
apiVersion: v1
kind: Pod
metadata:
  name: vlan-workload
  namespace: default
  annotations:
    k8s.v1.cni.cncf.io/networks: '[{"name":"vlan-stretch","namespace":"default"}]'
spec:
  # The br-hs-110 bridge backing this NAD only exists on workers (the
  # route reflectors do not host the L2VNI).
  nodeSelector:
    node-role.kubernetes.io/worker: ""
  containers:
    - name: agnhost
      image: registry.k8s.io/e2e-test-images/agnhost:2.47
      command: ["/agnhost", "netexec", "--http-port=8080"]
